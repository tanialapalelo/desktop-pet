<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Summon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
    html, body {
      width: 100%; height: 100%; background: transparent; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    #btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #f2a6c4;
      box-shadow: 0 3px 8px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    #btn:hover {
      transform: scale(1.12);
      box-shadow: 0 3px 9px rgba(0,0,0,0.32);
    }
    #btn:active { transform: scale(0.96); }
    #btn img {
      width: 78%;
      height: 78%;
      object-fit: contain;
      image-rendering: pixelated;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="btn">
    <img id="icon" src="" alt="summon pet" draggable="false" />
  </div>
  <script src="summon.js"></script>
</body>
</html>
