<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Chat</title>
  <link rel="stylesheet" href="chat.css" />
</head>
<body>
  <div id="card">
    <div id="header">
      <img id="header-icon" src="../../assets/icons/icon-32.png" alt="" />
      <span id="header-title">Pet Chat</span>
      <span id="mode-badge">basic</span>
      <button id="close-btn" title="Close">&times;</button>
    </div>
    <div id="messages"></div>
    <div id="input-row">
      <input id="text-input" type="text" placeholder="Say something..." maxlength="500" autofocus />
      <button id="send-btn">Send</button>
    </div>
  </div>
  <script src="chat.js"></script>
</body>
</html>
